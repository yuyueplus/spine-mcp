name: MCP portable checks
on:
  workflow_dispatch:
  push:
    paths: ['src/**', 'test/**', 'scripts/**', 'package*.json', 'tsconfig.json', 'native-bridge/**', '.github/workflows/mcp-checks.yml']
  pull_request:
    paths: ['src/**', 'test/**', 'scripts/**', 'package*.json', 'tsconfig.json', 'native-bridge/**', '.github/workflows/mcp-checks.yml']
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Linux media dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Windows media dependencies
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - name: macOS media dependencies
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Media version receipts
        run: ffmpeg -version
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run setup:psd-raster -- --python python
      - run: node scripts/ci-check.mjs npm-test
